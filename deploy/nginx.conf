# /etc/nginx/sites-available/marksheet  (then: ln -s ../sites-available/marksheet /etc/nginx/sites-enabled/)
# Replace marks.example.com with your domain, then run: sudo certbot --nginx -d marks.example.com
server {
    listen 80;
    server_name marks.example.com;

    # Responses carry two base64 PDFs
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # First lookup after a restart pays LibreOffice's cold start
        proxy_read_timeout 120s;
    }
}
