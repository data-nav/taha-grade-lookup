<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f2f5f9;
      --card: #ffffff;
      --ink: #14202e;
      --muted: #6b7788;
      --line: #e1e6ee;
      --accent: #0a96ee;
      --accent-dark: #0679c4;
      --accent-soft: #e6f4fd;
      --error-bg: #fdecec;
      --error-ink: #a32121;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- top bar ---------- */
    .topbar { background: var(--card); border-bottom: 1px solid var(--line); box-shadow: 0 1px 8px rgba(20,32,46,.05); }
    .topbar-in {
      max-width: 1000px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 18px;
    }
    .logo { height: 46px; width: auto; border-radius: 6px; display: block; }
    .divider { width: 1px; height: 30px; background: var(--line); }
    .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 26px 20px 70px; }

    /* ---------- search ---------- */
    .search {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: 0 2px 10px rgba(20,32,46,.04);
    }
    .search label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .row { display: flex; gap: 10px; }
    .row input {
      flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px;
      border: 1.5px solid var(--line); border-radius: 10px; outline: none; background: #fbfcfe;
      transition: border-color .15s, box-shadow .15s;
    }
    .row input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(10,150,238,.14); background: #fff; }

    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 24px;
      background: var(--accent); color: #fff; font-weight: 600; transition: background .15s, transform .05s;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }

    #msg { display: none; margin-top: 14px; padding: 11px 14px; border-radius: 10px; font-size: 14px; }
    #msg.error { display: block; background: var(--error-bg); color: var(--error-ink); }
    #msg.info  { display: block; background: var(--accent-soft); color: #075f99; }

    .choices { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { background: #fff; color: #075f99; border: 1.5px solid var(--accent); padding: 9px 14px; font-size: 14px; }
    .choices button:hover { background: var(--accent); color: #fff; }

    /* ---------- student card ---------- */
    #student {
      display: none; position: relative; margin-top: 22px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px 24px; box-shadow: 0 2px 10px rgba(20,32,46,.04);
      border-left: 5px solid var(--accent);
    }
    .s-main { display: flex; align-items: center; gap: 18px; padding-right: 190px; }
    .avatar {
      flex: none; width: 58px; height: 58px; border-radius: 50%;
      background: linear-gradient(135deg, #1db0ff, #0a7fd1); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 21px;
    }
    .s-name { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0 0 8px; }
    .s-meta { display: flex; flex-wrap: wrap; gap: 8px 28px; }
    .s-meta div { font-size: 14px; color: var(--muted); }
    .s-meta b { display: block; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: #8a95a5; margin-bottom: 1px; }
    .s-meta span { color: var(--ink); font-weight: 600; font-size: 15px; }
    #dl { position: absolute; top: 16px; right: 16px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; }
    #dl svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- previews ---------- */
    .doc {
      display: none; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      margin-top: 20px; overflow: hidden; box-shadow: 0 2px 10px rgba(20,32,46,.04);
    }
    .doc-head { padding: 12px 18px; border-bottom: 1px solid var(--line); background: #fafbfd; font-weight: 700; font-size: 14px; letter-spacing: .3px; }
    .pages { padding: 16px; background: #e8edf3; }
    .pages canvas { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 2px 8px rgba(20,32,46,.16); border-radius: 2px; }
    .pages canvas + canvas { margin-top: 14px; }
    .fallback { padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }

    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
      border: 2px solid rgba(7,95,153,.25); border-top-color: #075f99; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .topbar-in { padding: 12px 14px; gap: 12px; }
      .logo { height: 36px; }
      .topbar h1 { font-size: 16px; }
      .wrap { padding: 18px 12px 60px; }
      .s-main { padding-right: 0; padding-top: 44px; }
      #dl { top: 12px; right: 12px; }
      .s-name { font-size: 19px; }
      .row button { padding: 12px 16px; }
    }
  </style>
</head>

      <div class="divider"></div>
      <h1>Marksheet &amp; Transcript</h1>
    </div>
  </header>

  <main class="wrap">
    <div class="search">
      <label for="sid">Student ID</label>
      <div class="row">
        <input id="sid" type="text" inputmode="numeric" placeholder="Enter Student ID" autocomplete="off" autofocus>
        <button id="go">View</button>
      </div>
      <div id="msg"></div>
    </div>

    <section id="student">
      <button id="dl" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        <span id="dl-label">Download PDF</span>
      </button>
      <div class="s-main">
        <div class="avatar" id="avatar"></div>
        <div>
          <h2 class="s-name" id="s-name"></h2>
          <div class="s-meta">
            <div><b>Student ID</b><span id="s-id"></span></div>
            <div><b>Program</b><span id="s-program"></span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="doc" id="doc-marksheet">
      <div class="doc-head">Marksheet</div>
      <div class="pages" id="pages-marksheet"></div>
    </section>

    <section class="doc" id="doc-transcript">
      <div class="doc-head">Transcript</div>
      <div class="pages" id="pages-transcript"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script>
    var combined = null;   // { filename, blob } once the merged PDF is ready
    var $ = function (id) { return document.getElementById(id); };

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    $('go').addEventListener('click', search);
    $('sid').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });
    $('dl').addEventListener('click', download);

    function search() {
      var id = $('sid').value.trim();
      if (!id) { showMsg('Please enter a Student ID.', 'error'); return; }
      runSearch(id, null);
    }

    function runSearch(id, programKey) {
      hideResults();
      setBusy(true);
      showMsg('<span class="spinner"></span>Preparing documents…', 'info');

      fetch('/api/lookup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, programKey: programKey })
      }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error((data && data.detail) ? data.detail : ('Request failed (' + r.status + ')'));
          return data;
        });
      }).then(onDocuments).catch(onFailure);
    }

    /* The same ID exists in several programs: ask which one to open */
    function showChoices(id, options) {
      var m = $('msg');
      m.className = 'info';
      m.innerHTML = 'This ID is in more than one program. Which one would you like to open?';
      var box = document.createElement('div');
      box.className = 'choices';
      options.forEach(function (o) {
        var b = document.createElement('button');
        b.textContent = o.label + ' — ' + o.name;
        b.addEventListener('click', function () { runSearch(id, o.key); });
        box.appendChild(b);
      });
      m.appendChild(box);
      setBusy(false);
    }

    function onDocuments(res) {
      if (res.ambiguous) { showChoices($('sid').value.trim(), res.ambiguous); return; }

      $('s-name').textContent = res.studentName;
      $('s-id').textContent = res.studentId;
      $('s-program').textContent = res.program || '—';
      $('avatar').textContent = initials(res.studentName);
      $('student').style.display = 'block';
      $('doc-marksheet').style.display = 'block';
      $('doc-transcript').style.display = 'block';

      // Merge both PDFs into one file for the single download button
      mergePdfs(res).then(function (m) {
        combined = m;
        $('dl').disabled = false;
        $('dl-label').textContent = 'Download PDF';
      }).catch(function (err) {
        console.error(err);
        $('dl-label').textContent = 'Download unavailable';
        showMsg('Could not prepare the download. Please try again.', 'error');
      });

      Promise.all([
        renderPdf('marksheet', res.marksheetBase64),
        renderPdf('transcript', res.transcriptBase64)
      ]).then(function () {
        if ($('msg').className === 'info') hideMsg();
        setBusy(false);
      }).catch(function (err) {
        console.error(err);
        showMsg('Preview could not be displayed, but the PDF can still be downloaded.', 'error');
        setBusy(false);
      });
    }

    function onFailure(err) {
      var text = (err && err.message) ? err.message : String(err);
      showMsg(escapeHtml(text.replace(/^(Error|Exception):\s*/i, '')), 'error');
      setBusy(false);
    }

    /* ---------- merge: marksheet page(s) + transcript page(s) ---------- */
    function mergePdfs(res) {
      if (!window.PDFLib) return Promise.reject(new Error('pdf-lib not loaded'));
      var PDFDocument = PDFLib.PDFDocument;
      var out;
      return PDFDocument.create().then(function (doc) {
        out = doc;
        return [res.marksheetBase64, res.transcriptBase64].reduce(function (chain, b64) {
          return chain.then(function () {
            return PDFDocument.load(b64ToBytes(b64)).then(function (src) {
              return out.copyPages(src, src.getPageIndices());
            }).then(function (pages) {
              pages.forEach(function (p) { out.addPage(p); });
            });
          });
        }, Promise.resolve());
      }).then(function () {
        return out.save();
      }).then(function (bytes) {
        return { filename: res.filename, blob: new Blob([bytes], { type: 'application/pdf' }) };
      });
    }

    function download() {
      if (!combined) return;
      var url = URL.createObjectURL(combined.blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = combined.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    /* ---------- PDF preview (PDF.js -> canvas) ---------- */
    function renderPdf(kind, base64) {
      var host = $('pages-' + kind);
      host.innerHTML = '';

      if (!window.pdfjsLib) {
        host.innerHTML = '<div class="fallback">Preview unavailable. Use the Download button.</div>';
        return Promise.resolve();
      }

      return pdfjsLib.getDocument({ data: b64ToBytes(base64) }).promise.then(function (pdf) {
        var chain = Promise.resolve();
        var cssWidth = Math.max(host.clientWidth - 32, 300);
        var dpr = Math.min(window.devicePixelRatio || 1, 3) * 1.5;   // sharper text

        for (var p = 1; p <= pdf.numPages; p++) {
          (function (pageNo) {
            chain = chain.then(function () {
              return pdf.getPage(pageNo).then(function (page) {
                var base = page.getViewport({ scale: 1 });
                var viewport = page.getViewport({ scale: (cssWidth / base.width) * dpr });
                var canvas = document.createElement('canvas');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                host.appendChild(canvas);
                return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
              });
            });
          })(p);
        }
        return chain;
      });
    }

    /* ---------- helpers ---------- */
    function initials(name) {
      var parts = String(name).trim().split(/\s+/);
      var s = (parts[0] || '').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '');
      return s.toUpperCase();
    }
    function b64ToBytes(b64) {
      var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    function showMsg(html, cls) { var m = $('msg'); m.className = cls; m.innerHTML = html; }
    function hideMsg() { $('msg').className = ''; }
    function hideResults() {
      combined = null;
      $('dl').disabled = true;
      $('dl-label').textContent = 'Preparing PDF…';
      $('student').style.display = 'none';
      ['marksheet', 'transcript'].forEach(function (k) {
        $('doc-' + k).style.display = 'none';
        $('pages-' + k).innerHTML = '';
      });
    }
    function setBusy(b) { $('go').disabled = b; $('sid').disabled = b; if (!b) $('sid').focus(); }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
